<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>User Profile Card Generator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>User Profile Card Generator</h1>

    <p>Create your profile card</p>

    <form action="/create-profile" method="POST">

      <label>Name</label>
      <input
        type="text"
        name="name"
        placeholder="Enter your name"
        required
      >

      <label>Bio</label>
      <textarea
        name="bio"
        placeholder="Write your bio"
        required
      ></textarea>

      <label>Skills</label>
      <input
        type="text"
        name="skills"
        placeholder="JavaScript, Node.js, MongoDB"
        required
      >

      <label>GitHub Link</label>
      <input
        type="url"
        name="github"
        placeholder="https://github.com/username"
      >

      <label>LinkedIn Link</label>
      <input
        type="url"
        name="linkedin"
        placeholder="https://linkedin.com/in/username"
      >

      <label>Profile Image URL</label>
      <input
        type="url"
        name="avatar"
        placeholder="https://example.com/profile.jpg"
      >

      <button type="submit">
        Generate Profile Card
      </button>

    </form>

  </div>

</body>

</html>
